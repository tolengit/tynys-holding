<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tynys-Holding | Горнодобывающий инжиниринг Казахстана</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gr:#104332;       /* deep professional green */
  --gr-l:#1a634a;     /* lighter green */
  --gr-d:#0a2b21;     /* darker green */
  --gr-bg:#f0f7f3;    /* very light green tint */
  --gr-bg2:#e1ede7;   /* light green tint */
  --bl:#1b2b34;       /* industrial blue-grey */
  --bl-l:#2c3e4a;
  --acc:#d4af37;      /* gold accent */
  --bg:#fdfdfb;       /* pearl white */
  --bg2:#ffffff;
  --bg3:#f4f6f5;      /* soft grey-green */
  --brd:#e0e4e2;
  --brd2:#cfd5d2;
  --txt:#1c1f1d;
  --txt2:#4a504d;
  --txt3:#717a76;
  --sh:0 2px 10px rgba(0,0,0,0.04);
  --sh2:0 8px 30px rgba(0,0,0,0.08);
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:'Manrope',sans-serif;font-weight:400;overflow-x:hidden;line-height:1.6}

/* ─── MOBILE RESPONSIVENESS ─── */
@media (max-width: 1024px) {
  #nav { padding: 0 1.5rem; }
  .hero { padding: 4rem 1.5rem; }
  .hstats-col { position: relative; right: 0; top: 0; transform: none; flex-direction: row; border-left: none; border-top: 1px solid var(--brd); margin-top: 2rem; width: 100%; }
  .hstat { flex: 1; text-align: center; border-bottom: none; border-right: 1px solid var(--brd); }
  .hstat:last-child { border-right: none; }
  .about-strip, .pg, .about-layout, .si-bg, .pl, .tgrid, .ngrid, .wgrid, .cgrid, .frow2 { grid-template-columns: 1fr !important; gap: 2rem; }
  .sg { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 768px) {
  .nav-links { display: none; }
  .h1 { font-size: 54px; }
  .sg { grid-template-columns: 1fr; }
  .stats-row { grid-template-columns: 1fr 1fr; }
  .frow { justify-content: center; }
  footer { grid-template-columns: 1fr; text-align: center; gap: 1.5rem; }
  .fb-right { text-align: center; }
  .fl { flex-direction: column; gap: 1rem; }
}
button,input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:#f0eeea}
::-webkit-scrollbar-thumb{background:#c0bdb5;border-radius:2px}

/* ─── NAV ─── */
#nav{position:fixed;top:0;left:0;right:0;z-index:999;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 2.5rem;background:rgba(248,247,244,.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--brd);box-shadow:0 1px 8px rgba(0,0,0,.06)}
.nav-logo{display:flex;align-items:center;gap:0;cursor:pointer;text-decoration:none}
.nav-logo img{height:38px;width:auto;display:block;object-fit:contain}
.nav-links{display:flex;gap:0;list-style:none}
.nl{background:none;border:none;color:var(--txt3);font-family:'Manrope',sans-serif;font-size:12px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;padding:0 .9rem;height:64px;cursor:pointer;transition:color .2s;white-space:nowrap;position:relative}
.nl::after{content:'';position:absolute;bottom:0;left:.9rem;right:.9rem;height:2px;background:var(--gr);transform:scaleX(0);transition:transform .2s}
.nl:hover{color:var(--gr)}
.nl.act{color:var(--gr)}
.nl.act::after{transform:scaleX(1)}
.nav-r{display:flex;align-items:center;gap:.5rem}
.lb{background:none;border:1px solid var(--brd2);color:var(--txt3);padding:4px 10px;font-size:11px;font-weight:600;letter-spacing:.09em;cursor:pointer;border-radius:3px;transition:all .2s}
.lb:hover,.lb.act{border-color:var(--gr);color:var(--gr);background:var(--gr-bg)}
.ncta{background:var(--gr);color:#fff;border:none;padding:8px 20px;font-family:'Manrope',sans-serif;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;border-radius:3px;transition:background .2s;white-space:nowrap}
.ncta:hover{background:var(--gr-l)}

/* ─── PAGE ─── */
main{padding-top:64px}
.page{display:none;animation:fadeUp .28s ease both}
.page.on{display:block}
 @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ─── HERO ─── */
.hero{position:relative;min-height:calc(100vh - 64px);display:flex;flex-direction:column;justify-content:center;padding:5rem 2.5rem 4rem;overflow:hidden;background:var(--bg2)}
.hbg-dots{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(26,107,69,.08) 1px,transparent 1px);background-size:28px 28px;pointer-events:none}
.hbg-grad{position:absolute;inset:0;background:linear-gradient(135deg,rgba(235,245,239,.9) 0%,rgba(248,247,244,.3) 50%,rgba(13,61,92,.05) 100%);pointer-events:none}
.hline{position:absolute;top:0;right:38%;width:1px;height:100%;background:linear-gradient(180deg,transparent,rgba(26,107,69,.15) 40%,transparent);pointer-events:none}
.hero-inner{position:relative;z-index:1;max-width:680px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--gr);margin-bottom:1.4rem;padding:5px 12px 5px 0;border-left:3px solid var(--gr);padding-left:12px}
.h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(52px,8vw,96px);line-height:.92;letter-spacing:.02em;color:var(--bl);margin-bottom:.5rem}
.h1 em{display:block;color:var(--gr);font-style:normal}
.hsub{font-size:17px;font-weight:300;color:var(--txt2);line-height:1.75;margin-bottom:2.5rem;max-width:520px}
.hbtns{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.btn-p{background:var(--gr);color:#fff;border:none;padding:13px 30px;font-family:'Manrope',sans-serif;font-size:13px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;border-radius:3px;transition:background .2s}
.btn-p:hover{background:var(--gr-l)}
.btn-out{background:none;border:1.5px solid var(--bl);color:var(--bl);padding:12px 28px;font-family:'Manrope',sans-serif;font-size:13px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;border-radius:3px;transition:all .2s}
.btn-out:hover{background:var(--bl);color:#fff}
.hstats-col{position:absolute;right:2.5rem;top:50%;transform:translateY(-50%);z-index:1;display:flex;flex-direction:column;gap:0;border-left:2px solid var(--brd)}
.hstat{padding:1.4rem 1.6rem;border-bottom:1px solid var(--brd)}
.hstat:last-child{border-bottom:none}
.hstat-n{font-family:'Bebas Neue',sans-serif;font-size:38px;color:var(--gr);line-height:1}
.hstat-l{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--txt3)}

/* ─── TICKER ─── */
.ticker{background:var(--bl);padding:10px 0;overflow:hidden}
.ti-inner{display:flex;animation:tick 30s linear infinite}
.ti-item{white-space:nowrap;padding:0 2.5rem;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.75);display:flex;align-items:center;gap:2rem}
.ti-item::after{content:'◆';font-size:6px;color:var(--acc)}
 @keyframes tick{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* ─── SECTION BASE ─── */
.sec{padding:5rem 2.5rem}
.sec-alt{background:var(--bg3)}
.sec-white{background:var(--bg2)}
.slbl{font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gr);margin-bottom:.75rem;display:flex;align-items:center;gap:8px}
.slbl::before{content:'';width:20px;height:2px;background:var(--gr)}
.slbl.ctr{justify-content:center}
.slbl.ctr::before{display:none}
.sh{font-family:'Bebas Neue',sans-serif;font-size:clamp(32px,4.5vw,50px);line-height:.95;letter-spacing:.02em;color:var(--bl);margin-bottom:1rem}
.divider{height:1px;background:var(--brd);margin:0}

/* ─── HOME: ABOUT STRIP ─── */
.about-strip{display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:start}
.at p{color:var(--txt2);font-size:15px;line-height:1.75;margin-bottom:.9rem}
.at p strong{color:var(--gr-d);font-weight:600}
.acards{display:flex;flex-direction:column;gap:.9rem}
.acard{background:var(--bg2);border:1px solid var(--brd);padding:1.4rem 1.5rem;border-radius:4px;box-shadow:var(--sh);display:flex;gap:1rem;align-items:flex-start;transition:box-shadow .2s,border-color .2s}
.acard:hover{box-shadow:var(--sh2);border-color:var(--gr-bg2)}
.acard-ic{width:36px;height:36px;background:var(--gr-bg);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;color:var(--gr)}
.acard-txt h4{font-size:14px;font-weight:600;color:var(--bl);margin-bottom:.25rem}
.acard-txt p{font-size:13px;color:var(--txt3);line-height:1.55}

/* ─── HOME: SERVICES GRID ─── */
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--brd);border:1px solid var(--brd);margin-top:2rem;overflow:hidden;border-radius:4px}
.sc{background:var(--bg2);padding:2rem 1.7rem;transition:background .25s;cursor:pointer;position:relative}
.sc:hover{background:var(--gr-bg)}
.sc-n{font-family:'Bebas Neue',sans-serif;font-size:36px;color:rgba(26,107,69,.14);line-height:1;margin-bottom:.6rem}
.sc h3{font-size:15px;font-weight:600;color:var(--bl);margin-bottom:.6rem}
.sc p{font-size:13px;color:var(--txt3);line-height:1.6}
.sc-arr{position:absolute;top:1.5rem;right:1.5rem;font-size:16px;color:var(--brd2);transition:color .2s}
.sc:hover .sc-arr{color:var(--gr)}

/* ─── HOME: PROJ GRID ─── */
.pg{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem;margin-top:1.8rem}
.pc{background:var(--bg2);border:1px solid var(--brd);border-radius:4px;padding:1.8rem;cursor:pointer;transition:all .25s;box-shadow:var(--sh)}
.pc:hover{box-shadow:var(--sh2);border-color:var(--gr-bg2)}
.pmeta{display:flex;gap:.5rem;margin-bottom:.7rem;flex-wrap:wrap}
.ptype{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;background:var(--gr-bg);color:var(--gr);border-radius:2px}
.pregion{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;padding:3px 8px;background:var(--bg3);color:var(--txt3);border-radius:2px}
.pc h3{font-size:15px;font-weight:600;color:var(--bl);margin-bottom:.5rem}
.pc p{font-size:13px;color:var(--txt3);line-height:1.55}

/* ─── ABOUT PAGE ─── */
.about-layout{display:grid;grid-template-columns:1fr 1fr;gap:4rem}
.mbox{border-left:3px solid var(--gr);padding:1rem 1.3rem;background:var(--gr-bg);border-radius:0 4px 4px 0;margin-bottom:1.1rem}
.mbox .ml{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gr);margin-bottom:.4rem}
.mbox p{font-size:14px;color:var(--bl);line-height:1.65;font-weight:300}
.vlist{list-style:none;margin-top:.6rem}
.vlist li{padding:.5rem 0;border-bottom:1px solid var(--brd);font-size:13.5px;color:var(--txt2);display:flex;align-items:center;gap:.65rem}
.vlist li::before{content:'';width:6px;height:6px;background:var(--gr);border-radius:50%;flex-shrink:0}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:.9rem;margin:2rem 0}
.sbox{background:var(--bg2);border:1px solid var(--brd);padding:1.3rem;text-align:center;border-radius:4px;box-shadow:var(--sh)}
.sbox .sn{font-family:'Bebas Neue',sans-serif;font-size:38px;color:var(--gr);line-height:1}
.sbox .sl{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);margin-top:.2rem}
.clist{list-style:none;margin-top:.6rem}
.clist li{padding:.55rem 0;border-bottom:1px solid var(--brd);font-size:13px;color:var(--txt2);display:flex;align-items:flex-start;gap:.65rem}
.clist li::before{content:'✓';font-size:11px;color:var(--gr);flex-shrink:0;font-weight:700;margin-top:1px}
.lab-box{margin-top:1.8rem;padding:1.4rem;background:linear-gradient(135deg,var(--gr-bg),var(--bg2));border:1px solid var(--gr-bg2);border-radius:4px}
.lab-box strong{color:var(--bl);font-size:14px;font-weight:600;display:block;margin-bottom:.4rem}
.lab-box p{font-size:13px;color:var(--txt2);line-height:1.65}

/* ─── SERVICES PAGE ─── */
.slist{display:flex;flex-direction:column;gap:.6rem;margin-top:1.8rem}
.si{background:var(--bg2);border:1px solid var(--brd);border-radius:4px;overflow:hidden;transition:border-color .2s;box-shadow:var(--sh)}
.si.open{border-color:var(--gr);box-shadow:var(--sh2)}
.si-head{display:flex;align-items:center;gap:1.2rem;padding:1.3rem 1.6rem;cursor:pointer;user-select:none}
.si-n{font-family:'Bebas Neue',sans-serif;font-size:26px;color:rgba(26,107,69,.25);line-height:1;width:36px;flex-shrink:0}
.si-t{flex:1}
.si-t h3{font-size:15px;font-weight:600;color:var(--bl);margin-bottom:.15rem}
.si-t p{font-size:12.5px;color:var(--txt3)}
.si-tog{width:28px;height:28px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--txt3);transition:all .25s;flex-shrink:0;line-height:1}
.si.open .si-tog{background:var(--gr);color:#fff;transform:rotate(45deg)}
.si-body{display:none;padding:0 1.6rem 1.6rem;border-top:1px solid var(--brd)}
.si.open .si-body{display:block}
.si-bg{display:grid;grid-template-columns:1fr 1fr;gap:2rem;padding-top:1.3rem}
.si-body p{font-size:14px;color:var(--txt2);line-height:1.72;margin-bottom:1rem}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:.5rem}
.tag{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:4px 10px;background:var(--gr-bg);color:var(--gr);border-radius:2px}
.stgs{list-style:none;counter-reset:stg}
.stgs li{display:flex;align-items:center;gap:.65rem;padding:.42rem 0;border-bottom:1px solid var(--brd);font-size:13px;color:var(--txt2);counter-increment:stg}
.stgs li::before{content:counter(stg);font-size:10px;font-weight:700;width:20px;height:20px;background:var(--gr);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.slbl2{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gr);margin-bottom:.5rem}

/* ─── PROJECTS PAGE ─── */
.frow{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.8rem}
.fb{background:none;border:1px solid var(--brd);color:var(--txt3);padding:6px 14px;font-family:'Manrope',sans-serif;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;border-radius:3px;transition:all .2s}
.fb:hover,.fb.act{background:var(--gr);border-color:var(--gr);color:#fff}
.pl{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}
.pcard{background:var(--bg2);border:1px solid var(--brd);border-radius:4px;padding:1.8rem;box-shadow:var(--sh);transition:all .25s;cursor:pointer}
.pcard:hover{box-shadow:var(--sh2);border-color:var(--gr-bg2)}
.pcard h3{font-size:16px;font-weight:600;color:var(--bl);margin-bottom:.65rem}
.pcard p{font-size:13px;color:var(--txt3);line-height:1.6;margin-bottom:.9rem}
.pcmeta{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;padding-top:.9rem;border-top:1px solid var(--brd)}
.pcm .k{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gr);margin-bottom:.15rem}
.pcm .v{font-size:12px;font-weight:500;color:var(--bl)}

/* ─── TEAM PAGE ─── */
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.1rem;margin-top:1.8rem}
.tc{background:var(--bg2);border:1px solid var(--brd);border-radius:4px;padding:1.5rem;box-shadow:var(--sh);transition:all .25s}
.tc:hover{box-shadow:var(--sh2);border-color:var(--gr-bg2)}
.tav{width:48px;height:48px;background:var(--gr);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Manrope',sans-serif;font-size:15px;font-weight:700;color:#fff;margin-bottom:.9rem;letter-spacing:.04em}
.tc h4{font-size:14px;font-weight:600;color:var(--bl);margin-bottom:.18rem}
.tc .role{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--gr);margin-bottom:.4rem}
.tc .exp{font-size:10px;font-weight:600;padding:2px 8px;background:var(--gr-bg);color:var(--gr);display:inline-block;border-radius:2px;margin-bottom:.65rem}
.tc p{font-size:12px;color:var(--txt3);line-height:1.55}

/* ─── NEWS PAGE ─── */
.ngrid{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;margin-top:1.8rem}
.nc{background:var(--bg2);border:1px solid var(--brd);border-radius:4px;padding:1.8rem;box-shadow:var(--sh);transition:all .25s;cursor:pointer}
.nc:hover{box-shadow:var(--sh2);border-color:var(--gr-bg2)}
.nc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.9rem;gap:.8rem}
.ncat{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;background:var(--gr-bg);color:var(--gr);border-radius:2px;flex-shrink:0}
.ndate{font-size:11px;color:var(--txt3);font-weight:500}
.nc h3{font-size:15px;font-weight:600;color:var(--bl);margin-bottom:.65rem;line-height:1.3}
.nc p{font-size:13px;color:var(--txt3);line-height:1.6;margin-bottom:.9rem}
.nmore{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--gr)}

/* ─── CAREER PAGE ─── */
.wgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.1rem;margin:1.8rem 0 2.8rem}
.wc{background:var(--bg2);border:1px solid var(--brd);border-radius:4px;padding:1.5rem;box-shadow:var(--sh)}
.wc-ic{width:40px;height:40px;background:var(--gr-bg);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:.75rem;color:var(--gr)}
.wc h4{font-size:14px;font-weight:600;color:var(--bl);margin-bottom:.4rem}
.wc p{font-size:13px;color:var(--txt3);line-height:1.55}
.vlist2{display:flex;flex-direction:column;gap:.9rem;margin-top:1.2rem}
.vc{background:var(--bg2);border:1px solid var(--brd);border-radius:4px;padding:1.8rem;display:grid;grid-template-columns:1fr auto;gap:1.3rem;align-items:start;box-shadow:var(--sh);transition:all .25s}
.vc:hover{box-shadow:var(--sh2);border-color:var(--gr-bg2)}
.vc-pos{font-size:17px;font-weight:600;color:var(--bl);margin-bottom:.25rem}
.vc-dept{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gr);margin-bottom:.7rem}
.vbadges{display:flex;gap:.45rem;flex-wrap:wrap;margin-bottom:.65rem}
.vb{font-size:10px;font-weight:600;padding:3px 9px;background:var(--bg3);color:var(--txt3);border-radius:2px}
.vreqs{list-style:none}
.vreqs li{font-size:12.5px;color:var(--txt2);padding:.3rem 0;display:flex;align-items:flex-start;gap:.5rem;border-bottom:1px solid var(--brd)}
.vreqs li::before{content:'';width:5px;height:5px;background:var(--gr);border-radius:50%;flex-shrink:0;margin-top:6px}

/* ─── CONTACT PAGE ─── */
.cgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:4rem}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:1rem}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.fg label{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3)}
.fg input,.fg textarea,.fg select{background:var(--bg2);border:1.5px solid var(--brd);color:var(--txt);padding:10px 13px;font-family:'Manrope',sans-serif;font-size:14px;font-weight:400;outline:none;transition:border-color .2s;width:100%;border-radius:3px;-webkit-appearance:none}
.fg input:focus,.fg textarea:focus,.fg select:focus{border-color:var(--gr)}
.fg textarea{resize:vertical;min-height:100px}
.fg select option{background:#fff}
.iitems{margin-top:2rem;display:flex;flex-direction:column;gap:1.1rem}
.ii{display:flex;gap:.9rem;align-items:flex-start}

let lang='ru',curPage='home',openSrv=null,projFilter=0,formSent=false;

function setLang(l){
  lang=l;
  document.querySelectorAll('.lb').forEach(b=>b.classList.toggle('act',b.textContent===l.toUpperCase()));
  document.getElementById('ncta-btn').textContent=D[l].nav.cta;
  document.getElementById('foot-copy').textContent=D[l].nav.copy;
  document.getElementById('foot-addr').textContent=D[l].nav.addr;
  renderNav();renderFootLinks();renderPage(curPage);
}
function goto(p){
  document.querySelectorAll('.page').forEach(e=>e.classList.remove('on'));
  document.getElementById('p-'+p).classList.add('on');
  curPage=p;renderNav();renderPage(p);window.scrollTo(0,0);
}
function renderNav(){
  const n=D[lang].nav;
  document.getElementById('nav-links').innerHTML=PAGES.map(p=>`<li><button class="nl${curPage===p?' act':''}" onclick="goto('${p}')">${n[p]}</button></li>`).join('');
}
function renderFootLinks(){
  document.getElementById('foot-links').innerHTML=PAGES.map(p=>`<li><a onclick="goto('${p}')">${D[lang].nav[p]}</a></li>`).join('');
}
function renderPage(p){

}
